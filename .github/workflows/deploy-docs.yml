# Workflow name
name: "Chromatic Deployment"

# Event for the workflow
on: push

# List of jobs
jobs:
  chromatic:
    name: "Run Chromatic"
    runs-on: ubuntu-latest
    # Job steps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Configura o Node.js corretamente
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Ou a versão que você utiliza no projeto

      # 2. Ativa o Corepack para usar a versão exata do NPM (11.12.0) definida no package.json
      - name: Enable Corepack
        run: corepack enable

      # 3. Instala as dependências de todo o Monorepo usando NPM na raiz
      - name: Install Dependencies
        run: npm install

      # 4. Executa o Chromatic apontando para a pasta correta
      - uses: chromaui/action@latest
        with:
          workingDir: ./packages/docs
          # 👇 Força a action do Chromatic a usar o npm para rodar internamente
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
